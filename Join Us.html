<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Us | JerseyHubGh</title>
<meta name="description" content="Subscribe to JerseyHubGh for exclusive offers and updates.">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

<div id="toast-container"></div>

<section class="signup-container">
    <div class="signup-card">
        <h1>Join JerseyHubGh</h1>
        <p>Subscribe and receive exclusive offers and new product updates.</p>
        <form onsubmit="event.preventDefault(); document.querySelector('.success').style.display='block'; this.reset();">
            <input type="text" placeholder="Full Name" required>
            <input type="email" placeholder="Email Address" required>
            <button type="submit"><i class="fa-solid fa-bell"></i> Subscribe</button>
        </form>
        <p class="success" style="display:none;"><i class="fa-solid fa-check-circle"></i> Thank you for joining our community!</p>
        <p style="margin-top:20px; font-size:14px;"><a href="./index.html" style="color:#ff7a00;">← Back to Home</a></p>
    </div>
</section>

<script src="main.js"></script>
</body>
</html>
